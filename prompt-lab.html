<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A local-first workspace for managing prompts, experiments, test subjects, environments, and results." />
  <title>PromptLab — Experiment workspace</title>
  <style>
    :root {
      --ink: #191a1d;
      --muted: #6f7378;
      --faint: #9da1a6;
      --line: #e9e6df;
      --paper: #fbfaf7;
      --panel: #ffffff;
      --nav: #f1f0ec;
      --accent: #e85d33;
      --accent-dark: #bd3e1c;
      --accent-soft: #fff0e9;
      --green: #1f8a5b;
      --green-soft: #e8f7ef;
      --amber: #a86d13;
      --amber-soft: #fff4d8;
      --blue: #4b68d0;
      --blue-soft: #edf0ff;
      --shadow: 0 18px 55px rgba(36, 33, 27, .11);
      --radius: 14px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); min-width: 320px; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 236px 1fr; }

    .sidebar {
      background: var(--nav); border-right: 1px solid var(--line); padding: 25px 16px 18px;
      display: flex; flex-direction: column; min-height: 100vh; position: sticky; top: 0; height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 29px; font-weight: 760; letter-spacing: -.04em; font-size: 19px; }
    .brand-mark { width: 27px; height: 27px; border: 2px solid var(--ink); border-radius: 50%; position: relative; }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; background: var(--ink); }
    .brand-mark::before { width: 2px; height: 17px; left: 11px; top: 3px; transform: rotate(34deg); }
    .brand-mark::after { width: 10px; height: 2px; left: 7px; top: 11px; transform: rotate(-34deg); }
    .nav-label { padding: 0 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; font-weight: 750; margin: 7px 0 8px; }
    .nav { display: grid; gap: 3px; }
    .nav button { border: 0; background: transparent; text-align: left; border-radius: 9px; padding: 10px 11px; cursor: pointer; display: flex; align-items: center; gap: 11px; color: #595c61; font-size: 14px; }
    .nav button:hover { background: rgba(255,255,255,.62); color: var(--ink); }
    .nav button.active { background: var(--panel); color: var(--ink); box-shadow: 0 1px 5px rgba(40,35,28,.06); font-weight: 650; }
    .nav-icon { width: 18px; text-align: center; color: #7d7f82; font-size: 14px; }
    .nav-count { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .storage-note { margin-top: auto; padding: 15px 12px; border-top: 1px solid #dfddd7; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .storage-note strong { color: #4f5256; display: block; margin-bottom: 3px; }
    .clear-workspace { margin-top: 10px; padding: 0; border: 0; background: transparent; color: #a84a37; font-size: 10px; font-weight: 700; cursor: pointer; text-decoration: underline; text-decoration-color: #dfb6ac; text-underline-offset: 3px; }
    .clear-workspace:hover { color: #792d1e; }
    .profile { display: flex; align-items: center; gap: 10px; padding: 14px 10px 2px; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: #232428; color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 750; }
    .profile-name { font-size: 12px; font-weight: 650; }
    .profile-meta { font-size: 10px; color: var(--faint); margin-top: 2px; }

    .main { min-width: 0; }
    .topbar { height: 74px; padding: 0 38px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: rgba(251,250,247,.88); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 10; }
    .crumb { color: var(--muted); font-size: 12px; }
    .crumb strong { color: var(--ink); }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .search { position: relative; }
    .search input { width: 225px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); padding: 9px 34px 9px 32px; font-size: 12px; outline: none; }
    .search input:focus { border-color: #c8c5bd; box-shadow: 0 0 0 3px rgba(45,45,45,.04); }
    .search::before { content: "⌕"; position: absolute; left: 11px; top: 6px; color: var(--faint); font-size: 17px; }
    .kbd { position: absolute; right: 8px; top: 7px; font-size: 9px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
    .icon-btn { width: 35px; height: 35px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); cursor: pointer; display: grid; place-items: center; }
    .icon-btn:hover { border-color: #ccc8bf; }
    .primary { border: 0; background: var(--accent); color: #fff; border-radius: 9px; padding: 10px 15px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 5px 14px rgba(232,93,51,.22); }
    .primary:hover { background: var(--accent-dark); transform: translateY(-1px); }

    .content { padding: 39px 38px 60px; max-width: 1440px; margin: 0 auto; }
    .heading-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 27px; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(32px, 4vw, 46px); line-height: 1; letter-spacing: -.045em; margin: 0 0 9px; font-weight: 500; }
    .subtitle { color: var(--muted); margin: 0; font-size: 13px; }
    .date-chip { color: var(--muted); font-size: 11px; border: 1px solid var(--line); background: rgba(255,255,255,.56); border-radius: 999px; padding: 8px 12px; white-space: nowrap; }

    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 13px; margin-bottom: 25px; }
    .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 19px; min-height: 106px; position: relative; overflow: hidden; }
    .metric::after { content: ""; position: absolute; width: 70px; height: 70px; border-radius: 50%; background: var(--metric-color, var(--accent-soft)); right: -29px; bottom: -31px; opacity: .7; }
    .metric-label { color: var(--muted); font-size: 11px; margin-bottom: 15px; display: flex; justify-content: space-between; }
    .metric-value { font-family: Georgia, 'Times New Roman', serif; font-size: 29px; line-height: 1; letter-spacing: -.03em; }
    .metric-delta { font-family: Inter, sans-serif; font-size: 10px; color: var(--green); margin-left: 6px; }

    .workspace { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(270px, .72fr); gap: 17px; align-items: start; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
    .card-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 19px 15px; border-bottom: 1px solid var(--line); gap: 15px; }
    .card-title { font-size: 13px; font-weight: 720; }
    .segmented { display: flex; background: #f5f4f1; padding: 3px; border-radius: 8px; }
    .segmented button { border: 0; background: transparent; border-radius: 6px; padding: 6px 10px; font-size: 10px; color: var(--muted); cursor: pointer; }
    .segmented button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

    .list { padding: 4px 10px 10px; }
    .list-row { display: grid; grid-template-columns: 34px minmax(0,1fr) 110px 70px 30px; gap: 10px; align-items: center; padding: 13px 8px; border-bottom: 1px solid #f0eee9; cursor: pointer; border-radius: 9px; transition: background .16s; }
    .list-row:hover { background: #faf9f6; }
    .list-row:last-child { border-bottom: 0; }
    .run-index { width: 29px; height: 29px; border-radius: 8px; background: #f4f2ed; display: grid; place-items: center; color: var(--muted); font-size: 10px; font-weight: 720; }
    .run-title { font-size: 12px; font-weight: 680; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-meta { color: var(--faint); font-size: 10px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { justify-self: start; display: inline-flex; align-items: center; gap: 6px; font-size: 10px; border-radius: 999px; padding: 5px 8px; font-weight: 650; }
    .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status.completed { color: var(--green); background: var(--green-soft); }
    .status.running { color: var(--blue); background: var(--blue-soft); }
    .status.draft { color: var(--amber); background: var(--amber-soft); }
    .score { text-align: right; }
    .score strong { display: block; font-family: Georgia, serif; font-size: 18px; font-weight: 500; }
    .score span { color: var(--faint); font-size: 8px; text-transform: uppercase; letter-spacing: .08em; }
    .more { border: 0; background: transparent; color: var(--faint); cursor: pointer; border-radius: 5px; font-size: 17px; }
    .more:hover { background: #eceae5; color: var(--ink); }
    .empty { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 12px; }
    .empty strong { display: block; color: var(--ink); font-family: Georgia, serif; font-size: 20px; font-weight: 500; margin-bottom: 8px; }

    .right-stack { display: grid; gap: 17px; }
    .scorecard { padding: 20px; }
    .scorecard-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 19px; }
    .scorecard-title { font-size: 12px; font-weight: 720; }
    .scorecard small { color: var(--faint); font-size: 9px; }
    .big-score { display: flex; align-items: baseline; gap: 6px; margin-bottom: 14px; }
    .big-score strong { font-family: Georgia, serif; font-size: 44px; line-height: 1; font-weight: 500; }
    .big-score span { color: var(--muted); font-size: 11px; }
    .bar { height: 5px; background: #eeece7; border-radius: 999px; overflow: hidden; }
    .bar > i { display: block; width: 84%; height: 100%; background: var(--accent); border-radius: inherit; }
    .dimension { margin-top: 14px; display: grid; grid-template-columns: 1fr 30px; align-items: center; gap: 10px; font-size: 10px; color: var(--muted); }
    .dimension .mini-bar { grid-column: 1/-1; height: 3px; background: #eeece7; border-radius: 999px; margin-top: -4px; }
    .mini-bar i { display: block; height: 100%; background: #36373b; border-radius: inherit; }
    .activity { padding: 8px 19px 12px; }
    .activity-item { position: relative; padding: 11px 0 11px 20px; font-size: 10px; color: var(--muted); line-height: 1.45; }
    .activity-item::before { content: ""; position: absolute; width: 7px; height: 7px; border: 2px solid var(--accent); background: #fff; border-radius: 50%; left: 0; top: 14px; }
    .activity-item::after { content: ""; position: absolute; width: 1px; height: calc(100% - 5px); background: var(--line); left: 4px; top: 24px; }
    .activity-item:last-child::after { display: none; }
    .activity-item strong { color: var(--ink); font-weight: 650; }

    .record-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .record-card { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 18px; cursor: pointer; min-height: 165px; display: flex; flex-direction: column; transition: .18s ease; }
    .record-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(30,28,24,.06); border-color: #d9d5cc; }
    .record-type { color: var(--accent); font-size: 9px; text-transform: uppercase; letter-spacing: .11em; font-weight: 780; margin-bottom: 16px; }
    .record-card h3 { font-family: Georgia, serif; font-size: 19px; font-weight: 500; line-height: 1.15; margin: 0 0 9px; }
    .record-card p { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 0 0 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .record-foot { margin-top: auto; display: flex; justify-content: space-between; color: var(--faint); font-size: 9px; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(25,26,29,.34); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-backdrop.open { display: flex; animation: fadeIn .18s ease; }
    .modal { width: min(720px, 100%); max-height: 90vh; overflow: auto; background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.8); animation: slideIn .2s ease; }
    .modal-head { padding: 23px 25px 17px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--line); }
    .modal-kicker { color: var(--accent); font-size: 9px; text-transform: uppercase; letter-spacing: .13em; font-weight: 800; margin-bottom: 7px; }
    .modal h2 { font-family: Georgia, serif; font-size: 27px; letter-spacing: -.025em; font-weight: 500; margin: 0; }
    .close { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 20px; padding: 3px 7px; }
    form { padding: 23px 25px 25px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1/-1; }
    .field label { font-size: 10px; color: #595c60; font-weight: 720; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid #dedbd3; background: #fff; border-radius: 9px; padding: 10px 11px; color: var(--ink); outline: 0; font-size: 12px; }
    .field textarea { min-height: 90px; resize: vertical; line-height: 1.55; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); margin-top: 22px; padding-top: 18px; }
    .action-group { display: flex; gap: 8px; }
    .secondary, .danger { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px 13px; font-size: 11px; font-weight: 650; cursor: pointer; }
    .danger { color: #b33827; border-color: #f0d7d2; background: #fff8f6; }
    .setup-intro { margin: -3px 0 20px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .setup-section { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 13px; padding: 20px 0; border-top: 1px solid var(--line); }
    .setup-section:first-of-type { border-top: 0; padding-top: 0; }
    .step-index { width: 27px; height: 27px; border: 1px solid #dcd8cf; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: #fff; font-family: Georgia, serif; font-size: 12px; }
    .setup-body h3 { margin: 4px 0 4px; font-family: Georgia, serif; font-size: 17px; font-weight: 500; }
    .setup-body > p { color: var(--muted); font-size: 10px; line-height: 1.45; margin: 0 0 13px; }
    .mode-switch { display: inline-flex; padding: 3px; margin-bottom: 13px; border-radius: 8px; background: #ebe9e4; }
    .mode-switch button { border: 0; background: transparent; padding: 6px 10px; color: var(--muted); border-radius: 6px; font-size: 10px; cursor: pointer; }
    .mode-switch button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); font-weight: 700; }
    .mode-switch button:disabled { opacity: .38; cursor: not-allowed; }
    .setup-panel { background: rgba(255,255,255,.62); border: 1px solid #e6e2da; border-radius: 11px; padding: 13px; }
    .setup-panel.hidden { display: none; }
    .compact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .compact-grid .full { grid-column: 1/-1; }
    .setup-panel textarea { min-height: 76px; }
    .deferred-note { display: flex; gap: 9px; align-items: center; margin: 3px 0 -2px 47px; padding: 11px 13px; background: var(--green-soft); border-radius: 9px; color: #35705a; font-size: 10px; line-height: 1.4; }
    .deferred-note b { color: var(--green); font-size: 13px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 80; background: #242528; color: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 12px 16px; font-size: 11px; transform: translateY(20px); opacity: 0; pointer-events: none; transition: .25s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .mobile-toggle { display: none; }

    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideIn { from { transform: translateY(10px); opacity: .5 } to { transform: translateY(0); opacity: 1 } }
    @media (max-width: 980px) {
      .app { grid-template-columns: 76px 1fr; }
      .sidebar { padding-left: 11px; padding-right: 11px; }
      .brand { padding-left: 13px; }
      .brand span, .nav-label, .nav button > span:not(.nav-icon):not(.nav-count), .storage-note, .profile-info, .nav-count { display: none; }
      .nav button { justify-content: center; padding: 11px 0; }
      .profile { justify-content: center; }
      .workspace { grid-template-columns: 1fr; }
      .right-stack { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 700px) {
      .app { display: block; }
      .sidebar { position: fixed; left: -260px; width: 236px; z-index: 60; transition: left .2s; box-shadow: var(--shadow); }
      .sidebar.open { left: 0; }
      .sidebar .brand span, .sidebar .nav-label, .sidebar .nav button > span:not(.nav-icon):not(.nav-count), .sidebar .storage-note, .sidebar .profile-info, .sidebar .nav-count { display: initial; }
      .sidebar .nav button { justify-content: flex-start; padding: 10px 11px; }
      .mobile-toggle { display: grid; }
      .topbar { height: 64px; padding: 0 17px; }
      .crumb { display: none; }
      .search input { width: min(48vw, 210px); }
      .content { padding: 28px 17px 45px; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .record-grid { grid-template-columns: 1fr; }
      .list-row { grid-template-columns: 32px minmax(0,1fr) 68px 28px; }
      .list-row .status { display: none; }
      .right-stack { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .compact-grid { grid-template-columns: 1fr; }
      .compact-grid .full { grid-column: auto; }
      .date-chip { display: none; }
    }
    @media (max-width: 440px) {
      .metrics { grid-template-columns: 1fr; }
      .top-actions .primary { padding: 10px; font-size: 0; }
      .top-actions .primary::after { content: "+"; font-size: 18px; }
      .kbd { display: none; }
      .search input { padding-right: 10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><i class="brand-mark"></i><span>PromptLab</span></div>
      <div class="nav-label">Workspace</div>
      <nav class="nav" id="nav">
        <button class="active" data-view="studio"><span class="nav-icon">◇</span><span>Studio</span></button>
        <button data-view="prompts"><span class="nav-icon">¶</span><span>Prompts</span><span class="nav-count" data-count="prompts"></span></button>
        <button data-view="runs"><span class="nav-icon">↗</span><span>Experiment runs</span><span class="nav-count" data-count="runs"></span></button>
        <button data-view="subjects"><span class="nav-icon">◎</span><span>Test subjects</span><span class="nav-count" data-count="subjects"></span></button>
        <button data-view="environments"><span class="nav-icon">⌘</span><span>Environments</span><span class="nav-count" data-count="environments"></span></button>
      </nav>
      <div class="storage-note"><strong>Local workspace</strong>Your changes are saved automatically in this browser.<button class="clear-workspace" id="clearWorkspace">Clear everything</button></div>
      <div class="profile"><div class="avatar">AR</div><div class="profile-info"><div class="profile-name">Alex Rivera</div><div class="profile-meta">Research lead</div></div></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-toggle" id="mobileToggle" aria-label="Open navigation">☰</button>
        <div class="crumb">Workspace&nbsp; / &nbsp;<strong id="crumb">Studio</strong></div>
        <div class="top-actions">
          <div class="search"><input id="search" placeholder="Search workspace" aria-label="Search workspace"/><span class="kbd">⌘K</span></div>
          <button class="primary" id="newButton">+ New experiment</button>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <div><div class="modal-kicker" id="modalKicker">Edit record</div><h2 id="modalTitle">Experiment</h2></div>
        <button class="close" id="closeModal" aria-label="Close">×</button>
      </div>
      <form id="recordForm"></form>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'promptLabWorkspaceV1';
    const starter = {
      prompts: [
        { id:'p1', title:'Calm technical explainer', content:'Explain {{topic}} to a curious generalist. Lead with the practical answer, then add the minimum technical context needed. Use one concrete analogy.', tags:'explanation, clarity', owner:'Alex Rivera', updated:'2026-08-18' },
        { id:'p2', title:'Evidence-first product critique', content:'Evaluate the proposed product decision. Separate observations from assumptions, identify the highest-risk uncertainty, and propose the smallest useful test.', tags:'critique, product', owner:'Mina Okafor', updated:'2026-08-17' },
        { id:'p3', title:'Support reply — empathetic', content:'Draft a concise support response that acknowledges the issue, states what we know, offers a clear next step, and avoids overpromising.', tags:'support, tone', owner:'Alex Rivera', updated:'2026-08-12' },
        { id:'p4', title:'Structured meeting synthesis', content:'Turn these meeting notes into decisions, unresolved questions, owners, and dated next actions. Preserve uncertainty where it exists.', tags:'operations, summary', owner:'Jules Martin', updated:'2026-08-08' }
      ],
      subjects: [
        { id:'s1', title:'GPT-5 · balanced', type:'Language model', description:'Default reasoning profile with concise response preference.', traits:'balanced, concise, tool-enabled', version:'2026-08-12', updated:'2026-08-18' },
        { id:'s2', title:'GPT-5 · deep reasoning', type:'Language model', description:'Higher deliberation budget for complex analytical tasks.', traits:'analytical, thorough', version:'2026-08-12', updated:'2026-08-17' },
        { id:'s3', title:'Human review panel', type:'Evaluator group', description:'Five product specialists rating clarity, correctness, and trust.', traits:'expert, qualitative', version:'Panel B', updated:'2026-08-15' }
      ],
      environments: [
        { id:'e1', title:'Production sandbox', type:'API environment', description:'Isolated mirror of production tools with synthetic customer data.', config:'Temperature 0.4 · 8k output · Tools on', updated:'2026-08-18' },
        { id:'e2', title:'Deterministic baseline', type:'API environment', description:'Low-variance configuration used for regression comparisons.', config:'Temperature 0.0 · Seed 42 · Tools off', updated:'2026-08-15' },
        { id:'e3', title:'Human interview room', type:'Qualitative setting', description:'Moderated 30-minute remote session with screen recording.', config:'Zoom · Think-aloud protocol', updated:'2026-08-11' }
      ],
      runs: [
        { id:'r1', title:'Clarity under ambiguity', promptId:'p1', subjectId:'s1', environmentId:'e1', hypothesis:'Adding an explicit audience and a concrete analogy will improve first-pass comprehension.', result:'Participants located the practical answer faster. Analogies helped on abstract topics but occasionally reduced precision.', status:'completed', score:92, notes:'Keep the audience instruction. Add a clause asking the model to mark analogy limits.', updated:'2026-08-18' },
        { id:'r2', title:'Decision critique — tools off', promptId:'p2', subjectId:'s2', environmentId:'e2', hypothesis:'The evidence-first structure will reduce unsupported recommendations.', result:'', status:'running', score:78, notes:'3 of 5 batches complete.', updated:'2026-08-18' },
        { id:'r3', title:'Support tone calibration', promptId:'p3', subjectId:'s3', environmentId:'e3', hypothesis:'Explicitly avoiding overpromising increases trust without lowering warmth.', result:'Panel preferred the revised response 4:1 and rated it more trustworthy.', status:'completed', score:87, notes:'Test again with billing-related complaints.', updated:'2026-08-16' },
        { id:'r4', title:'Long-note synthesis', promptId:'p4', subjectId:'s1', environmentId:'e1', hypothesis:'An explicit output schema improves action capture in long meetings.', result:'', status:'draft', score:0, notes:'Need a representative transcript over 10k tokens.', updated:'2026-08-14' },
        { id:'r5', title:'Analogy boundary test', promptId:'p1', subjectId:'s2', environmentId:'e2', hypothesis:'Stating where an analogy breaks will preserve accuracy.', result:'Precision improved, but answers became 18% longer.', status:'completed', score:84, notes:'Try a one-sentence boundary limit.', updated:'2026-08-13' }
      ]
    };

    let state = loadState();
    let currentView = 'studio';
    let currentFilter = 'all';
    let query = '';

    const $ = (s, root=document) => root.querySelector(s);
    const $$ = (s, root=document) => [...root.querySelectorAll(s)];
    const labels = { studio:'Studio', prompts:'Prompts', runs:'Experiment runs', subjects:'Test subjects', environments:'Environments' };
    const singular = { prompts:'Prompt', runs:'Experiment', subjects:'Test subject', environments:'Environment' };

    function loadState(){
      try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); return saved && saved.runs ? saved : structuredClone(starter); }
      catch { return structuredClone(starter); }
    }
    function saveState(message='Changes saved'){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateCounts(); toast(message);
    }
    function esc(v=''){ return String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function today(){ return new Date().toISOString().slice(0,10); }
    function humanDate(v){ return new Date(v+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
    function byId(type,id){ return state[type].find(x=>x.id===id); }
    function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
    function toast(message){ const el=$('#toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove('show'),1800); }
    function updateCounts(){ $$('[data-count]').forEach(el=>el.textContent=state[el.dataset.count].length); }
    function match(item){ return !query || Object.values(item).join(' ').toLowerCase().includes(query); }

    function render(){
      $('#crumb').textContent=labels[currentView];
      $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));
      $('#newButton').textContent = currentView==='studio' || currentView==='runs' ? '+ New experiment' : '+ New '+singular[currentView].toLowerCase();
      $('#content').innerHTML = currentView==='studio' ? studioView() : collectionView(currentView);
      bindViewEvents(); updateCounts();
    }

    function studioView(){
      const complete=state.runs.filter(r=>r.status==='completed');
      const avg=complete.length ? Math.round(complete.reduce((a,r)=>a+(+r.score||0),0)/complete.length) : 0;
      const filtered=state.runs.filter(match).filter(r=>currentFilter==='all'||r.status===currentFilter);
      return `
        <div class="heading-row"><div><h1>Experiment studio</h1><p class="subtitle">Design better prompts through structured, repeatable observation.</p></div><div class="date-chip">Updated ${new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</div></div>
        <div class="metrics">
          <div class="metric" style="--metric-color:var(--accent-soft)"><div class="metric-label">Total experiments <span>↗</span></div><div class="metric-value">${state.runs.length}<span class="metric-delta">+2 this week</span></div></div>
          <div class="metric" style="--metric-color:var(--green-soft)"><div class="metric-label">Completed <span>✓</span></div><div class="metric-value">${complete.length}<span class="metric-delta">${state.runs.length ? Math.round(complete.length/state.runs.length*100) : 0}%</span></div></div>
          <div class="metric" style="--metric-color:var(--blue-soft)"><div class="metric-label">Average score <span>◌</span></div><div class="metric-value">${avg}<span class="metric-delta">/ 100</span></div></div>
          <div class="metric" style="--metric-color:var(--amber-soft)"><div class="metric-label">Prompt library <span>¶</span></div><div class="metric-value">${state.prompts.length}<span class="metric-delta">active</span></div></div>
        </div>
        <div class="workspace">
          <div class="card">
            <div class="card-head"><div class="card-title">Recent experiments</div><div class="segmented">${['all','running','completed','draft'].map(x=>`<button data-filter="${x}" class="${currentFilter===x?'active':''}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div>
            <div class="list">${filtered.length ? filtered.map((r,i)=>runRow(r,i)).join('') : `<div class="empty"><strong>No experiments found</strong>Try another filter or create a new experiment.</div>`}</div>
          </div>
          <div class="right-stack">
            <div class="card scorecard">
              <div class="scorecard-top"><div class="scorecard-title">Quality signal</div><small>COMPLETED RUNS</small></div>
              <div class="big-score"><strong>${avg}</strong><span>/ 100 average</span></div><div class="bar"><i style="width:${avg}%"></i></div>
              <div class="dimension"><span>Clarity</span><b>${Math.min(98,avg+5)}</b><div class="mini-bar"><i style="width:${Math.min(98,avg+5)}%"></i></div></div>
              <div class="dimension"><span>Correctness</span><b>${Math.max(0,avg-2)}</b><div class="mini-bar"><i style="width:${Math.max(0,avg-2)}%"></i></div></div>
              <div class="dimension"><span>Usefulness</span><b>${Math.min(99,avg+1)}</b><div class="mini-bar"><i style="width:${Math.min(99,avg+1)}%"></i></div></div>
            </div>
            <div class="card"><div class="card-head"><div class="card-title">Recent activity</div><small style="color:var(--faint);font-size:9px">AUTO-SAVED</small></div><div class="activity">
              ${state.runs.slice(0,3).map(r=>`<div class="activity-item"><strong>${esc(r.title)}</strong><br>${r.status==='completed'?'Results recorded':'Experiment updated'} · ${humanDate(r.updated)}</div>`).join('')}
            </div></div>
          </div>
        </div>`;
    }

    function runRow(r,i){
      const p=byId('prompts',r.promptId), s=byId('subjects',r.subjectId);
      return `<div class="list-row" data-edit="runs" data-id="${r.id}"><div class="run-index">${String(i+1).padStart(2,'0')}</div><div><div class="run-title">${esc(r.title)}</div><div class="run-meta">${esc(p?.title||'No prompt')} · ${esc(s?.title||'No subject')}</div></div><span class="status ${r.status}">${r.status}</span><div class="score"><strong>${r.score||'—'}</strong><span>score</span></div><button class="more" aria-label="Edit">···</button></div>`;
    }

    function collectionView(type){
      const records=state[type].filter(match);
      const subtitles={
        prompts:'Reusable instructions, variables, and framing for every study.',
        runs:'Hypotheses, configurations, observations, and measured outcomes.',
        subjects:'Models, people, or systems being evaluated in your experiments.',
        environments:'The conditions, tools, and settings where tests are performed.'
      };
      return `<div class="heading-row"><div><h1>${labels[type]}</h1><p class="subtitle">${subtitles[type]}</p></div><div class="date-chip">${records.length} ${records.length===1?'record':'records'}</div></div>
        ${type==='runs' ? `<div class="card"><div class="list">${records.length?records.map((r,i)=>runRow(r,i)).join(''):`<div class="empty"><strong>No experiments found</strong>Create your first structured test.</div>`}</div></div>` : `<div class="record-grid">${records.length?records.map(r=>recordCard(type,r)).join(''):`<div class="empty"><strong>No ${labels[type].toLowerCase()} found</strong>Create a record to get started.</div>`}</div>`}`;
    }

    function recordCard(type,r){
      const desc=type==='prompts'?r.content:r.description;
      const meta=type==='prompts'?r.tags:(type==='subjects'?r.traits:r.config);
      return `<article class="record-card" data-edit="${type}" data-id="${r.id}"><div class="record-type">${esc(type==='subjects'?r.type:type==='environments'?r.type:'Prompt template')}</div><h3>${esc(r.title)}</h3><p>${esc(desc)}</p><div class="record-foot"><span>${esc(meta||'No details')}</span><span>${humanDate(r.updated)}</span></div></article>`;
    }

    const fields={
      prompts:[['title','Title','text','full'],['owner','Owner','text',''],['tags','Tags','text',''],['content','Prompt content','textarea','full']],
      subjects:[['title','Subject name','text','full'],['type','Subject type','text',''],['version','Version / cohort','text',''],['traits','Traits','text','full'],['description','Description','textarea','full']],
      environments:[['title','Environment name','text','full'],['type','Environment type','text',''],['config','Configuration','text',''],['description','Description','textarea','full']],
      runs:[['title','Experiment title','text','full'],['promptId','Prompt','promptSelect',''],['subjectId','Test subject','subjectSelect',''],['environmentId','Environment','environmentSelect',''],['status','Status','statusSelect',''],['score','Score (0–100)','number',''],['hypothesis','Hypothesis','textarea','full'],['result','Experimental result','textarea','full'],['notes','Notes & next step','textarea','full']]
    };

    function openNewExperiment(){
      const hasPrompts=state.prompts.length>0, hasSubjects=state.subjects.length>0, hasEnvironments=state.environments.length>0;
      $('#modalKicker').textContent='Guided setup';
      $('#modalTitle').textContent='New experiment';
      $('#recordForm').innerHTML=`
        <p class="setup-intro">Set up the test in one place. The experiment starts as a draft, so results, score, and final status can be decided after you run it.</p>
        <section class="setup-section">
          <div class="step-index">1</div><div class="setup-body"><h3>Name the experiment</h3><p>Give this run a clear, searchable name and optionally state what you expect to learn.</p>
            <div class="compact-grid"><div class="field full"><label>Experiment title</label><input name="title" required autofocus placeholder="e.g. Concise answer calibration" /></div><div class="field full"><label>Hypothesis <span style="font-weight:400;color:var(--faint)">(optional)</span></label><textarea name="hypothesis" placeholder="What outcome do you expect, and why?"></textarea></div></div>
          </div>
        </section>
        <section class="setup-section">
          <div class="step-index">2</div><div class="setup-body"><h3>Configure the prompt</h3><p>Write a prompt for this experiment or reuse one from your library.</p>
            <input type="hidden" name="promptMode" value="new" />
            <div class="mode-switch"><button type="button" class="active" data-mode-group="prompt" data-mode="new">Write new</button><button type="button" data-mode-group="prompt" data-mode="existing" ${hasPrompts?'':'disabled'}>Choose existing</button></div>
            <div class="setup-panel" id="prompt-new"><div class="compact-grid"><div class="field full"><label>Prompt title</label><input name="newPromptTitle" data-requires placeholder="e.g. Calm technical explainer" /></div><div class="field full"><label>Prompt instructions</label><textarea name="newPromptContent" data-requires placeholder="Write the complete prompt to test…"></textarea></div></div></div>
            <div class="setup-panel hidden" id="prompt-existing"><div class="field"><label>Prompt library</label><select name="promptId">${state.prompts.length?state.prompts.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join(''):'<option value="">No saved prompts yet</option>'}</select></div></div>
          </div>
        </section>
        <section class="setup-section">
          <div class="step-index">3</div><div class="setup-body"><h3>Choose the test subject</h3><p>The current default is selected. You can also create and attach a new subject without leaving this setup.</p>
            <input type="hidden" name="subjectMode" value="${hasSubjects?'existing':'new'}" />
            <div class="mode-switch"><button type="button" class="${hasSubjects?'active':''}" data-mode-group="subject" data-mode="existing" ${hasSubjects?'':'disabled'}>Use default</button><button type="button" class="${hasSubjects?'':'active'}" data-mode-group="subject" data-mode="new">Create new</button></div>
            <div class="setup-panel ${hasSubjects?'':'hidden'}" id="subject-existing"><div class="field"><label>Test subject</label><select name="subjectId">${state.subjects.map(s=>`<option value="${s.id}">${esc(s.title)} · ${esc(s.type)}</option>`).join('')}</select></div></div>
            <div class="setup-panel ${hasSubjects?'hidden':''}" id="subject-new"><div class="compact-grid"><div class="field"><label>Subject name</label><input name="newSubjectTitle" data-requires placeholder="e.g. GPT-5 · concise" /></div><div class="field"><label>Subject type</label><input name="newSubjectType" data-requires placeholder="Language model, panel…" /></div><div class="field full"><label>Description <span style="font-weight:400;color:var(--faint)">(optional)</span></label><textarea name="newSubjectDescription" placeholder="Relevant traits or evaluation context"></textarea></div></div></div>
          </div>
        </section>
        <section class="setup-section">
          <div class="step-index">4</div><div class="setup-body"><h3>Choose the environment</h3><p>The current default is prefilled. Create a new environment here when the test needs different conditions.</p>
            <input type="hidden" name="environmentMode" value="${hasEnvironments?'existing':'new'}" />
            <div class="mode-switch"><button type="button" class="${hasEnvironments?'active':''}" data-mode-group="environment" data-mode="existing" ${hasEnvironments?'':'disabled'}>Use default</button><button type="button" class="${hasEnvironments?'':'active'}" data-mode-group="environment" data-mode="new">Create new</button></div>
            <div class="setup-panel ${hasEnvironments?'':'hidden'}" id="environment-existing"><div class="field"><label>Environment</label><select name="environmentId">${state.environments.map(e=>`<option value="${e.id}">${esc(e.title)} · ${esc(e.type)}</option>`).join('')}</select></div></div>
            <div class="setup-panel ${hasEnvironments?'hidden':''}" id="environment-new"><div class="compact-grid"><div class="field"><label>Environment name</label><input name="newEnvironmentTitle" data-requires placeholder="e.g. Production sandbox" /></div><div class="field"><label>Environment type</label><input name="newEnvironmentType" data-requires placeholder="API environment…" /></div><div class="field full"><label>Configuration <span style="font-weight:400;color:var(--faint)">(optional)</span></label><textarea name="newEnvironmentConfig" placeholder="Model settings, tools, protocol, constraints…"></textarea></div></div></div>
          </div>
        </section>
        <div class="deferred-note"><b>✓</b><span><strong>Ready as a draft.</strong> Add observations, results, score, and final status when the experiment has been run.</span></div>
        <div class="modal-actions"><div></div><div class="action-group"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">Create experiment</button></div></div>`;

      function setMode(group,mode){
        const form=$('#recordForm');
        form.elements[group+'Mode'].value=mode;
        $$(`[data-mode-group="${group}"]`,form).forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
        ['new','existing'].forEach(name=>{
          const panel=$(`#${group}-${name}`);
          panel.classList.toggle('hidden',name!==mode);
          $$('[data-requires]',panel).forEach(input=>input.required=name===mode);
          $$('select',panel).forEach(input=>input.required=name===mode);
        });
      }
      ['prompt','subject','environment'].forEach(group=>setMode(group,$('#recordForm').elements[group+'Mode'].value));
      $$('[data-mode-group]',$('#recordForm')).forEach(button=>button.onclick=()=>{if(!button.disabled)setMode(button.dataset.modeGroup,button.dataset.mode);});

      $('#modalBackdrop').classList.add('open'); document.body.style.overflow='hidden';
      $('#cancelModal').onclick=closeModal;
      $('#recordForm').onsubmit=e=>{
        e.preventDefault(); const data=Object.fromEntries(new FormData(e.target)); const date=today();
        let promptId=data.promptId, subjectId=data.subjectId, environmentId=data.environmentId;
        if(data.promptMode==='new'){
          promptId=uid('p'); state.prompts.unshift({id:promptId,title:data.newPromptTitle,content:data.newPromptContent,tags:'experiment prompt',owner:'Alex Rivera',updated:date});
        }
        if(data.subjectMode==='new'){
          subjectId=uid('s'); state.subjects.unshift({id:subjectId,title:data.newSubjectTitle,type:data.newSubjectType,description:data.newSubjectDescription,traits:'',version:'',updated:date});
        }
        if(data.environmentMode==='new'){
          environmentId=uid('e'); state.environments.unshift({id:environmentId,title:data.newEnvironmentTitle,type:data.newEnvironmentType,description:'Created during experiment setup.',config:data.newEnvironmentConfig,updated:date});
        }
        state.runs.unshift({id:uid('r'),title:data.title,promptId,subjectId,environmentId,hypothesis:data.hypothesis,result:'',status:'draft',score:0,notes:'',updated:date});
        saveState('Experiment and configuration saved'); closeModal(); render();
      };
    }

    function openModal(type,id){
      if(type==='runs' && !id){ openNewExperiment(); return; }
      const item=id?byId(type,id):{};
      $('#modalKicker').textContent=id?'Edit record':'Create record';
      $('#modalTitle').textContent=id?(item.title||singular[type]):'New '+singular[type].toLowerCase();
      const controls=fields[type].map(([key,label,kind,width])=>{
        let control=''; const val=item[key]??'';
        if(kind==='textarea') control=`<textarea name="${key}" ${key==='content'||key==='hypothesis'?'required':''}>${esc(val)}</textarea>`;
        else if(kind.endsWith('Select')){
          const options=kind==='statusSelect' ? [['draft','Draft'],['running','Running'],['completed','Completed']] : state[kind.replace('Select','')+'s'].map(x=>[x.id,x.title]);
          control=`<select name="${key}" required>${options.map(([v,t])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
        } else control=`<input name="${key}" type="${kind}" value="${esc(val)}" ${kind==='number'?'min="0" max="100"':''} ${key==='title'?'required autofocus':''}/>`;
        return `<div class="field ${width}"><label>${label}</label>${control}</div>`;
      }).join('');
      $('#recordForm').innerHTML=`<div class="form-grid">${controls}</div><div class="modal-actions"><div>${id?'<button type="button" class="danger" id="deleteRecord">Delete</button>':''}</div><div class="action-group">${id?'<button type="button" class="secondary" id="duplicateRecord">Duplicate</button>':''}<button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">Save ${singular[type].toLowerCase()}</button></div></div>`;
      $('#modalBackdrop').classList.add('open'); document.body.style.overflow='hidden';
      $('#recordForm').onsubmit=e=>{ e.preventDefault(); const data=Object.fromEntries(new FormData(e.target)); if('score'in data)data.score=Math.max(0,Math.min(100,Number(data.score)||0)); data.updated=today(); if(id) Object.assign(item,data); else {data.id=uid(type[0]); state[type].unshift(data);} saveState(id?'Record updated':'Record created'); closeModal(); render(); };
      $('#cancelModal').onclick=closeModal;
      if(id){
        $('#duplicateRecord').onclick=()=>{ const copy={...item,id:uid(type[0]),title:item.title+' — copy',updated:today()}; state[type].unshift(copy); saveState('Record duplicated'); closeModal(); render(); };
        $('#deleteRecord').onclick=()=>deleteRecord(type,id);
      }
    }

    function deleteRecord(type,id){
      if(!confirm(`Delete this ${singular[type].toLowerCase()}? This cannot be undone.`)) return;
      state[type]=state[type].filter(x=>x.id!==id);
      if(type==='prompts') state.runs.forEach(r=>{if(r.promptId===id)r.promptId=''});
      if(type==='subjects') state.runs.forEach(r=>{if(r.subjectId===id)r.subjectId=''});
      if(type==='environments') state.runs.forEach(r=>{if(r.environmentId===id)r.environmentId=''});
      saveState('Record deleted'); closeModal(); render();
    }

    function clearEverything(){
      const total=state.prompts.length+state.runs.length+state.subjects.length+state.environments.length;
      if(!total){ toast('Workspace is already empty'); return; }
      if(!confirm(`Clear all ${total} workspace records? Every prompt, experiment, test subject, environment, and result will be permanently removed.`)) return;
      state={prompts:[],runs:[],subjects:[],environments:[]};
      currentView='studio'; currentFilter='all'; query=''; $('#search').value='';
      saveState('Workspace cleared'); render();
    }

    function closeModal(){ $('#modalBackdrop').classList.remove('open'); document.body.style.overflow=''; }
    function bindViewEvents(){
      $$('[data-filter]').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;render();});
      $$('[data-edit]').forEach(el=>el.onclick=e=>{e.stopPropagation();openModal(el.dataset.edit,el.dataset.id);});
    }
    $$('#nav button').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;currentFilter='all';$('#sidebar').classList.remove('open');render();});
    $('#newButton').onclick=()=>openModal(currentView==='studio'?'runs':currentView);
    $('#clearWorkspace').onclick=clearEverything;
    $('#closeModal').onclick=closeModal;
    $('#modalBackdrop').onclick=e=>{if(e.target===e.currentTarget)closeModal();};
    $('#mobileToggle').onclick=()=>$('#sidebar').classList.toggle('open');
    $('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();render();};
    document.addEventListener('keydown',e=>{
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();}
      if(e.key==='Escape')closeModal();
    });
    render();
  </script>
</body>
</html>
