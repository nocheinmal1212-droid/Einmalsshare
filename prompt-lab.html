<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local-first editor for prompt projects, child prompts, subjects, environments, and test results.">
  <title>PromptLab — Prompt project editor</title>
  <style>
    :root {
      --bg: #f4f3ef; --paper: #fff; --rail: #202321; --rail-2: #292c2a;
      --ink: #20231f; --muted: #6f756f; --faint: #9ba19b; --line: #e3e3dc; --soft: #f7f7f3;
      --accent: #cf573d; --accent-soft: #fae9e4; --green: #287554; --green-soft: #e5f3ec;
      --blue: #4f67bb; --blue-soft: #eaf0ff; --shadow: 0 18px 50px rgba(26,30,27,.14);
      --ui: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; overflow: hidden; color: var(--ink); background: var(--bg); font-family: var(--ui); font-size: 14px; line-height: 1.45; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { width: 100%; height: 100vh; height: 100dvh; display: grid; grid-template-columns: 248px minmax(0,1fr); overflow: hidden; }

    .project-rail { min-width: 0; height: 100%; overflow: hidden; color: #e7e9e5; background: var(--rail); border-right: 1px solid #171918; display: flex; flex-direction: column; }
    .brand { height: 64px; flex: 0 0 64px; padding: 0 18px; display: flex; align-items: center; gap: 11px; border-bottom: 1px solid #333734; font-weight: 730; letter-spacing: -.02em; }
    .brand-mark { width: 25px; height: 25px; border: 1px solid #737c75; border-radius: 7px; display: grid; place-items: center; color: #ff8062; font-family: Georgia, serif; font-size: 17px; }
    .rail-head { flex: 0 0 auto; padding: 19px 14px 11px; }
    .rail-label { display: flex; justify-content: space-between; align-items: center; margin: 0 5px 10px; color: #999f9a; font-size: 10px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .new-project { width: 100%; border: 1px solid #444945; background: var(--rail-2); color: #f2f3f0; border-radius: 8px; padding: 9px 11px; display: flex; align-items: center; gap: 9px; text-align: left; font-size: 12px; }
    .new-project:hover { border-color: #606761; background: #303431; }
    .new-project b { color: #ff8062; font-size: 17px; font-weight: 400; line-height: 1; }
    .project-search { margin-top: 10px; position: relative; }
    .project-search input { width: 100%; border: 0; border-radius: 7px; background: #191c1a; color: #dfe2de; outline: 0; padding: 8px 10px 8px 30px; font-size: 11px; }
    .project-search input:focus { box-shadow: 0 0 0 1px #58605a; }
    .project-search::before { content: "⌕"; position: absolute; left: 10px; top: 4px; color: #7d847e; font-size: 17px; }
    .project-list { min-height: 0; overflow: auto; padding: 2px 9px 14px; scrollbar-color: #474c48 transparent; scrollbar-width: thin; }
    .project-button { width: 100%; border: 0; border-radius: 8px; background: transparent; color: #bfc4bf; padding: 10px; margin-bottom: 3px; display: grid; grid-template-columns: 27px minmax(0,1fr); gap: 9px; align-items: center; text-align: left; }
    .project-button:hover { background: #292d2a; color: #fff; }
    .project-button.active { background: #343936; color: #fff; }
    .project-icon { width: 27px; height: 27px; border: 1px solid #4c524d; border-radius: 6px; display: grid; place-items: center; color: #e5765b; font-family: Georgia, serif; font-size: 12px; }
    .project-button.active .project-icon { background: #fff0eb; color: var(--accent); border-color: transparent; }
    .project-name { min-width: 0; font-size: 11px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-meta { color: #7f8680; font-size: 9px; margin-top: 3px; }
    .rail-foot { flex: 0 0 auto; border-top: 1px solid #343835; padding: 13px 14px 16px; }
    .local-note { color: #858c86; font-size: 9px; line-height: 1.5; margin-bottom: 10px; }
    .local-note strong { display: block; color: #b9beba; font-size: 10px; }
    .clear-all { border: 0; background: transparent; color: #d58c7c; padding: 0; font-size: 10px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #74483f; }
    .clear-all:hover { color: #ffaf9d; }

    .workspace-shell { min-width: 0; min-height: 0; height: 100%; display: grid; grid-template-rows: 64px minmax(0,1fr); }
    .topbar { min-width: 0; background: var(--paper); border-bottom: 1px solid var(--line); padding: 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .top-left, .top-right { display: flex; align-items: center; min-width: 0; gap: 10px; }
    .breadcrumb { min-width: 0; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .breadcrumb strong { color: var(--ink); font-weight: 650; }
    .save-state { display: flex; align-items: center; gap: 6px; color: var(--green); font-size: 10px; white-space: nowrap; }
    .save-state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .save-state.saving { color: #9a741f; }
    .tool-button { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 8px 11px; font-size: 10px; font-weight: 650; white-space: nowrap; }
    .tool-button:hover { background: var(--soft); border-color: #cccec7; }
    .tool-button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .tool-button.primary:hover { background: #343934; }
    .tool-button:disabled { opacity: .45; cursor: not-allowed; }
    .mobile-menu { display: none; width: 34px; height: 34px; padding: 0; place-items: center; font-size: 16px; }
    .rail-collapse { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; font-size: 15px; line-height: 1; }
    .workspace { min-width: 0; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 232px minmax(0,1fr); }

    @media (min-width: 901px) {
      .app, .project-rail, .brand, .project-button { transition: grid-template-columns .2s ease, width .2s ease, padding .2s ease; }
      .app.rail-collapsed { grid-template-columns: 68px minmax(0,1fr); }
      .app.rail-collapsed .brand { padding: 0; justify-content: center; }
      .app.rail-collapsed .brand span,
      .app.rail-collapsed .rail-head,
      .app.rail-collapsed .project-button > div:last-child,
      .app.rail-collapsed .rail-foot { display: none; }
      .app.rail-collapsed .project-list { padding: 13px 8px; }
      .app.rail-collapsed .project-button { display: flex; justify-content: center; padding: 8px; }
      .app.rail-collapsed .project-icon { flex: 0 0 31px; width: 31px; height: 31px; }
    }

    .tree { min-width: 0; min-height: 0; overflow-y: auto; background: #efeee9; border-right: 1px solid #dadad3; padding: 20px 11px; scrollbar-width: thin; scrollbar-color: #c7c7c0 transparent; }
    .tree-project { padding: 0 9px 17px; }
    .tree-kicker { color: var(--faint); font-size: 9px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 5px; }
    .tree-title { font-size: 12px; font-weight: 720; line-height: 1.35; overflow-wrap: anywhere; }
    .tree-root, .folder-button, .tree-item { width: 100%; border: 0; background: transparent; border-radius: 7px; text-align: left; display: flex; align-items: center; color: #565b56; }
    .tree-root { padding: 9px; gap: 8px; font-size: 11px; font-weight: 650; }
    .tree-root:hover, .folder-button:hover, .tree-item:hover { background: #e4e3dd; color: var(--ink); }
    .tree-root.active, .folder-button.active, .tree-item.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(37,40,37,.07); }
    .root-symbol { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-family: Georgia, serif; }
    .folder { margin-top: 4px; }
    .folder-button { padding: 8px 9px; gap: 7px; font-size: 10px; font-weight: 650; }
    .chevron { width: 9px; color: #939892; font-size: 9px; }
    .folder-glyph { color: #7d827d; width: 16px; }
    .folder-count { margin-left: auto; color: #a0a59f; font-size: 9px; font-variant-numeric: tabular-nums; }
    .tree-children { padding-left: 20px; position: relative; }
    .tree-children::before { content: ""; position: absolute; left: 13px; top: 0; bottom: 7px; width: 1px; background: #d5d5ce; }
    .tree-item { min-width: 0; padding: 7px; gap: 6px; font-size: 10px; position: relative; }
    .tree-item span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-dot { width: 5px; height: 5px; flex: 0 0 5px; border-radius: 50%; background: #a5aaa4; }
    .tree-item.active .file-dot { background: var(--accent); }
    .tree-empty { color: #a1a69f; font-size: 9px; padding: 5px 7px 8px; }

    .surface { min-width: 0; min-height: 0; overflow: auto; background: var(--bg); scrollbar-width: thin; scrollbar-color: #c9c9c2 transparent; }
    .surface-inner { width: min(1160px,100%); min-height: 100%; margin: 0 auto; padding: 31px 32px 52px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { color: var(--accent); font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 7px; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 30px; line-height: 1.15; letter-spacing: -.025em; font-weight: 500; }
    .page-subtitle { max-width: 620px; margin: 7px 0 0; color: var(--muted); font-size: 11px; }
    .head-actions { display: flex; gap: 8px; flex: 0 0 auto; }
    .danger-button { border: 1px solid #efd2ca; color: #a74430; background: #fff8f6; border-radius: 7px; padding: 8px 10px; font-size: 10px; font-weight: 650; }
    .danger-button:hover { background: #fbe7e2; }

    .editor-grid { min-width: 0; display: grid; grid-template-columns: minmax(0,1fr) 250px; gap: 16px; align-items: start; }
    .editor-card, .side-card, .collection-card, .form-card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 1px 2px rgba(35,38,35,.025); }
    .editor-card { min-width: 0; overflow: hidden; }
    .editor-toolbar { min-height: 47px; padding: 8px 11px 8px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fafaf7; }
    .editor-label { color: #5d625c; font-size: 10px; font-weight: 730; }
    .editor-actions { display: flex; gap: 6px; }
    .editor-action { border: 1px solid #dedfd8; background: #fff; border-radius: 6px; padding: 6px 8px; font-size: 9px; color: #5f645f; }
    .editor-action:hover { border-color: #bfc2ba; color: var(--ink); }
    .title-input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: #fff; outline: 0; padding: 19px 22px 15px; font-family: Georgia, "Times New Roman", serif; font-size: 23px; line-height: 1.25; }
    .title-input:focus { box-shadow: inset 3px 0 0 var(--accent); }
    .prompt-editor { display: block; width: 100%; min-height: 430px; border: 0; resize: vertical; outline: 0; padding: 23px 25px; background: #fff; color: #252925; font-family: var(--mono); font-size: 13px; line-height: 1.75; tab-size: 2; white-space: pre-wrap; overflow-wrap: break-word; }
    .prompt-editor:focus { box-shadow: inset 3px 0 0 var(--accent-soft); }
    .editor-foot { min-height: 39px; border-top: 1px solid var(--line); padding: 9px 15px; display: flex; justify-content: space-between; align-items: center; color: var(--faint); font-size: 9px; background: #fafaf7; }
    .side-stack { display: grid; gap: 12px; }
    .side-card { padding: 16px; }
    .side-card h3 { margin: 0 0 13px; font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: #626762; }
    .stat-list { display: grid; gap: 10px; }
    .stat { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 10px; }
    .stat strong { color: var(--ink); font-family: Georgia, serif; font-size: 16px; font-weight: 500; }
    .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border-radius: 999px; padding: 5px 7px; font-family: var(--mono); font-size: 8px; background: var(--blue-soft); color: var(--blue); }
    .chip.empty { background: var(--soft); color: var(--faint); font-family: var(--ui); }
    .quick-link { width: 100%; border: 0; border-top: 1px solid #ecece6; background: transparent; padding: 10px 0; display: flex; justify-content: space-between; text-align: left; font-size: 10px; color: var(--muted); }
    .quick-link:first-of-type { border-top: 0; padding-top: 0; }
    .quick-link:hover { color: var(--ink); }
    .quick-link b { color: var(--ink); font-weight: 650; }

    .collection-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 11px; }
    .collection-card { min-width: 0; padding: 17px; text-align: left; cursor: pointer; transition: transform .15s ease,border-color .15s ease,box-shadow .15s ease; }
    .collection-card:hover { transform: translateY(-1px); border-color: #cfd0c9; box-shadow: 0 8px 25px rgba(30,34,31,.06); }
    .collection-type { color: var(--accent); font-size: 8px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 9px; }
    .collection-card h3 { margin: 0 0 7px; font-family: Georgia, serif; font-weight: 500; font-size: 17px; line-height: 1.25; }
    .collection-card p { min-height: 32px; margin: 0; color: var(--muted); font-size: 10px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-foot { margin-top: 14px; padding-top: 10px; border-top: 1px solid #eeeee8; display: flex; align-items: center; justify-content: space-between; color: var(--faint); font-size: 9px; }
    .score-pill { padding: 4px 7px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-weight: 750; }
    .form-card { padding: 21px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field { min-width: 0; display: grid; gap: 6px; }
    .field.full { grid-column: 1/-1; }
    .field label { color: #626762; font-size: 9px; font-weight: 750; letter-spacing: .03em; }
    .field input, .field textarea, .field select { width: 100%; border: 1px solid #dbdcd5; border-radius: 7px; background: #fff; outline: 0; padding: 10px 11px; font-size: 11px; }
    .field textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: #8e958e; box-shadow: 0 0 0 3px rgba(99,107,100,.08); }
    .form-hint { color: var(--faint); font-size: 9px; }
    .form-actions { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
    .empty-state { min-height: 55vh; display: grid; place-items: center; text-align: center; padding: 40px; }
    .empty-box { max-width: 440px; }
    .empty-symbol { width: 50px; height: 50px; border: 1px solid #d7d8d1; border-radius: 13px; display: grid; place-items: center; margin: 0 auto 17px; color: var(--accent); background: #fff; font-family: Georgia, serif; font-size: 24px; }
    .empty-box h2 { margin: 0 0 7px; font-family: Georgia, serif; font-weight: 500; font-size: 25px; }
    .empty-box p { margin: 0 0 18px; color: var(--muted); font-size: 11px; }

    .dialog-backdrop { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(20,23,21,.62); }
    .dialog-backdrop.open { display: flex; }
    .dialog { width: min(520px,100%); max-height: 90vh; overflow: auto; background: #fff; border-radius: 12px; box-shadow: var(--shadow); }
    .dialog-head { padding: 20px 22px 15px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; }
    .dialog-kicker { color: var(--accent); font-size: 8px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 5px; }
    .dialog h2 { margin: 0; font-family: Georgia, serif; font-size: 23px; font-weight: 500; }
    .dialog-close { border: 0; background: transparent; color: var(--muted); font-size: 20px; padding: 0 4px; }
    .dialog form { padding: 20px 22px 22px; }
    .dialog-copy { color: var(--muted); font-size: 10px; margin: 0 0 16px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .toast { position: fixed; z-index: 120; right: 22px; bottom: 22px; padding: 11px 14px; border-radius: 8px; background: #252925; color: #fff; box-shadow: var(--shadow); font-size: 10px; opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .18s ease,transform .18s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 218px minmax(0,1fr); }
      .workspace { grid-template-columns: 210px minmax(0,1fr); }
      .surface-inner { padding-left: 22px; padding-right: 22px; }
      .editor-grid { grid-template-columns: minmax(0,1fr) 220px; }
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 68px minmax(0,1fr); }
      .brand { padding: 0; justify-content: center; }
      .brand span, .rail-head, .project-button > div:last-child, .rail-foot { display: none; }
      .project-list { padding: 13px 8px; }
      .project-button { display: flex; justify-content: center; padding: 8px; }
      .project-icon { flex: 0 0 31px; width: 31px; height: 31px; }
      .editor-grid { grid-template-columns: 1fr; }
      .side-stack { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .rail-collapse { display: none; }
    }
    @media (max-width: 700px) {
      .app { display: block; }
      .project-rail { position: fixed; z-index: 80; top: 0; bottom: 0; left: -270px; width: 248px; height: 100%; box-shadow: var(--shadow); transition: left .2s ease; }
      .project-rail.open { left: 0; }
      .project-rail .brand { padding: 0 18px; justify-content: flex-start; }
      .project-rail .brand span, .project-rail .rail-head, .project-rail .project-button > div:last-child, .project-rail .rail-foot { display: block; }
      .project-rail .project-button { display: grid; justify-content: initial; padding: 10px; }
      .mobile-menu { display: grid; }
      .topbar { padding: 0 13px; }
      .top-right .tool-button:not(.primary) { display: none; }
      .workspace { grid-template-columns: 176px minmax(0,1fr); }
      .tree { padding: 14px 8px; }
      .surface-inner { padding: 22px 14px 40px; }
      .page-head { display: block; }
      .head-actions { margin-top: 13px; }
      .collection-grid, .field-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .side-stack { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .workspace { display: block; overflow: auto; }
      .tree { min-height: auto; max-height: 205px; border-right: 0; border-bottom: 1px solid #dadad3; }
      .surface { overflow: visible; }
      .workspace-shell { overflow: hidden; }
      .prompt-editor { min-height: 360px; padding: 18px; font-size: 12px; }
      .editor-toolbar { align-items: flex-start; }
      .editor-actions { flex-wrap: wrap; justify-content: flex-end; }
      .page-subtitle, .save-state { display: none; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="project-rail" id="projectRail">
      <div class="brand"><div class="brand-mark">P</div><span>PromptLab</span></div>
      <div class="rail-head"><div class="rail-label"><span>Prompt projects</span><span id="projectCount">0</span></div><button class="new-project" id="newProject"><b>+</b><span>New prompt project</span></button><div class="project-search"><input id="projectSearch" aria-label="Search projects" placeholder="Find a project"></div></div>
      <div class="project-list" id="projectList"></div>
      <div class="rail-foot"><div class="local-note"><strong>Saved on this device</strong>Edits are stored automatically in this browser.</div><button class="clear-all" id="clearAll">Clear everything</button></div>
    </aside>
    <section class="workspace-shell">
      <header class="topbar"><div class="top-left"><button class="tool-button mobile-menu" id="mobileMenu" aria-label="Open projects">☰</button><button class="tool-button rail-collapse" id="railCollapse" aria-label="Collapse project sidebar" title="Collapse project sidebar">«</button><div class="breadcrumb" id="breadcrumb">PromptLab</div></div><div class="top-right"><span class="save-state" id="saveState">Saved</span><button class="tool-button" id="copyPrompt">Copy prompt</button><button class="tool-button primary" id="quickAdd">+ Add child</button></div></header>
      <div class="workspace"><nav class="tree" id="tree"></nav><main class="surface" id="surface"></main></div>
    </section>
  </div>
  <div class="dialog-backdrop" id="dialogBackdrop" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><div class="dialog-head"><div><div class="dialog-kicker" id="dialogKicker">New project</div><h2 id="dialogTitle">Create a prompt project</h2></div><button class="dialog-close" id="dialogClose" aria-label="Close">×</button></div><form id="dialogForm"></form></div></div>
  <div class="toast" id="toast"></div>

  <script>
    const STORE='promptLabProjectsV3';
    const seed={projects:[

    function fallbackCopy(text){const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();toast('Prompt copied')}
    function insertVariable(){const editor=$('#promptEditor');if(!editor)return;const name=prompt('Variable name (without braces):');if(!name?.trim())return;const token='{{'+name.trim()+'}}',start=editor.selectionStart,end=editor.selectionEnd;editor.setRangeText(token,start,end,'end');editor.dispatchEvent(new Event('input'));editor.focus()}
    function clearAll(){if(!state.projects.length){toast('Workspace is already empty');return}if(!confirm(`Clear all ${state.projects.length} prompt projects and every child record? This cannot be undone.`))return;state={projects:[]};projectId=null;selection={type:'prompt',id:null};save(true);render();toast('Everything cleared')}
    $('#newProject').onclick=openProjectDialog;$('#dialogClose').onclick=closeDialog;$('#dialogBackdrop').onclick=e=>{if(e.target===e.currentTarget)closeDialog()};$('#clearAll').onclick=clearAll;$('#railCollapse').onclick=toggleRail;$('#mobileMenu').onclick=()=>$('#projectRail').classList.toggle('open');$('#projectSearch').oninput=e=>{search=e.target.value.trim().toLowerCase();renderProjects()};$('#quickAdd').onclick=()=>addItem(selection.type==='folder'?selection.id:'child');$('#copyPrompt').onclick=()=>{const p=project(),item=currentItem();if(!p)return;copyText(selection.type==='child'?item.prompt:p.prompt)};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#projectSearch').focus()}if(e.key==='Escape'){closeDialog();$('#projectRail').classList.remove('open')}});applyRailState();render();
  </script>
</body>
</html>
